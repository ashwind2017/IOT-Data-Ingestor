services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: iot_ingestor
      POSTGRES_USER: iot
      POSTGRES_PASSWORD: iot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iot -d iot_ingestor"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
